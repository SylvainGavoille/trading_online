api:
  tws_endpoint: "127.0.0.1"
  port: 4002       # IB Gateway Paper Trading (4002), TWS Paper (7497)
  client_id: 10    # Client ID for dashboard (change if conflict with other connections)
  collector_client_id: 11  # Separate ID used by the options/portfolio collector scripts

# Technical Analysis Configuration
technical_analysis:
  indicators:
    sma_periods: [20, 50, 200]  # Multiple SMAs for different timeframes
    ema_periods: [12, 26]  # For MACD
    rsi:
      period: 14
      overbought: 70
      oversold: 30
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    bollinger_bands:
      period: 20
      std_dev: 2
    volume_ma_period: 20

# Sentiment Analysis Configuration
sentiment_analysis:
  news:
    update_interval: 300  # seconds
    lookback_period: 86400  # 24 hours in seconds
    min_articles: 5
  social:
    update_interval: 180  # seconds
    platforms: ["twitter", "reddit"]
    min_mentions: 10
  weights:
    news: 0.6
    social: 0.4

# Risk Management Configuration
risk_management:
  position_limits:
    max_position_size: 100  # maximum position size in shares
    max_portfolio_exposure: 0.25  # maximum exposure as fraction of portfolio
  loss_limits:
    daily_loss_limit: 1000  # maximum daily loss in base currency
    max_drawdown: 0.15  # maximum drawdown as fraction of portfolio
  trade_frequency:
    min_time_between_trades: 300  # minimum seconds between trades
    max_daily_trades: 10  # maximum number of trades per day
  stop_loss:
    atr_multiplier: 2  # multiply ATR for dynamic stop loss
    max_loss_per_trade: 0.02  # maximum loss per trade as fraction of portfolio
  risk_reward:
    min_ratio: 2.0  # minimum risk/reward ratio required for trade approval
    target_ratio: 3.0  # ideal risk/reward ratio

# Trading Execution Configuration
execution:
  order_types: ["market", "limit"]
  default_order_type: "limit"
  limit_order_timeout: 60  # seconds to wait for limit order
  slippage_tolerance: 0.001  # maximum acceptable slippage
  position_sizing:
    method: "risk_based"  # risk_based or fixed_size
    risk_per_trade: 0.01  # 1% risk per trade
    default_size: 10  # default position size if fixed

# Agent System Configuration
agent_system:
  update_interval: 60  # seconds between full system updates
  confidence_thresholds:
    technical: 0.7  # minimum technical signal strength
    sentiment: 0.6  # minimum sentiment signal strength
    combined: 0.65  # minimum combined signal strength
  signal_weights:
    technical: 0.7
    sentiment: 0.3
  handoff_timeout: 30  # seconds to wait for agent handoffs

# Fee Configuration (IBKR)
# Choose one of three plans: "lite", "pro_fixed", "pro_tiered"
fees:
  # ========== CURRENT PLAN ==========
  ibkr_plan: "pro_fixed"  # Options: "lite", "pro_fixed", "pro_tiered"

  # ========== IBKR PRO FIXED SETTINGS ==========
  # Used only if ibkr_plan = "pro_fixed"
  per_share_rate: 0.005      # $0.005 per share
  min_commission: 1.00       # Minimum $1.00 per order
  max_commission_pct: 0.01   # Maximum 1% of trade value

  # ========== REGULATORY FEES (ALL PLANS) ==========
  sec_fee_rate: 0.0000278    # SEC fee: $27.80 per $1M (sells only)
  finra_taf_rate: 0.000166   # FINRA TAF: $0.166 per 1000 shares (sells only)

  # ========== PLAN DESCRIPTIONS ==========
  # LITE:
  #   - $0 commission on US stocks/ETFs
  #   - Best for: beginners, buy & hold, low volume
  #
  # PRO_FIXED:
  #   - $0.005/share (min $1, max 1%)
  #   - Best for: active traders, predictable costs
  #
  # PRO_TIERED:
  #   - Volume-based rates (0.0035 to 0.0015 per share)
  #   - Rebates for adding liquidity
  #   - Best for: high frequency, algo trading, high volume

# Options Snapshot Collector
# Controls src/data/collect_options_snapshot.py (runs at market close daily).
options_collector:
  top_n_symbols: 50          # top-N symbols by daily volume from price_historical
  min_price_filter: 5.0      # skip stocks with close < $5 (penny stocks have no listed options)
  dte_min: 7                 # minimum days to expiry
  dte_max: 90                # maximum days to expiry
  moneyness_range_pct: 0.20  # keep strikes within ±20% of spot price
  max_expirations: 3         # nearest N expiration dates per symbol
  batch_size: 20             # option snapshot requests sent concurrently
  batch_delay_s: 1.0         # seconds to wait between batches (IBKR pacing)

# ML Options Optimizer
# Controls the ILP (PuLP) / greedy trade selection layer in src/ml/pipeline.py.
# Budget percentages (max_premium_spend_pct_bp, max_margin_add_pct_bp) are
# shared with BacktestConfig in src/ml/config.py — edit there for per-trade caps.
ml_optimizer:
  prefer_ilp: true           # true = use PuLP ILP solver; false = greedy fallback
  max_trades_per_symbol: 1   # max contracts per underlying per trading day

  long_premium:
    # Greek caps: set a positive float to cap cumulative delta/vega of selected trades.
    # null (or omit) means uncapped.
    max_abs_portfolio_delta: ~   # e.g. 2000.0
    max_abs_portfolio_vega: ~    # e.g. 5000.0

  short_premium:
    max_abs_portfolio_delta: ~
    max_abs_portfolio_vega: ~

# Monitoring Configuration
monitoring:
  log_level: "INFO"
  metrics_interval: 300  # seconds between metrics updates
  save_trades: true
  save_signals: true
